# Minimal fuzzel theme shared by the shortcut-driven pickers —
# open_project_workspace.sh (Mod+Alt+P), task-add.sh (Mod+Alt+T) and
# task-list.sh (Mod+Alt+L). Kept separate from fuzzel.ini (passed with
# --config=) so it can be this stripped-down without affecting other fuzzel use.
#
# lines and width are set on the command line, sized to whatever is being shown.

[main]
font=Ubuntu:size=16
line-height=38
# Empty prompt: no label, no header. The input row still renders (fuzzel always
# shows one) but it's blank until you type, and typing filters the list.
prompt=""
icons-enabled=no
# overlay so it sits above fullscreen windows, like the DMS spotlight.
layer=overlay
horizontal-pad=28
vertical-pad=18
inner-pad=12
match-counter=no
# The script feeds the folders in alphabetical order — keep it.
sort-result=no

# Colours track the DMS "Peace & Quiet" cyan variant that dms/colors.kdl
# generates for niri, so the picker matches the window borders.
#
# The background is half-transparent to match ghostty's background-opacity of
# 0.5 — niri blurs what's behind it via the layer-rule on the "launcher"
# namespace in config.kdl, which is the half of the effect this file can't do
# on its own. Raising this alpha back towards ff makes the blur invisible.
[colors]
background=130f1a80
text=f0f0f0ff
prompt=f0f0f0ff
input=f0f0f0ff
selection=49ccd2ff
selection-text=130f1aff
match=49ccd2ff
selection-match=130f1aff
border=49ccd2ff

[border]
radius=14
# No outline. The blurred, half-transparent background is enough to separate the
# popup from the wallpaper, and a hard cyan edge around it fought that. radius
# still applies with width=0, so the corners stay rounded.
width=0

[dmenu]
# Show the input box even with nothing on stdin — an empty ~/Projects should
# still let you type a name and have the script create it.
exit-immediately-if-empty=no
