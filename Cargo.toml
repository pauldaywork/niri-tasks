[package]
name = "niri-tasks"
version = "0.1.0"
edition = "2021"
description = "Workspace-scoped Taskwarrior for niri: the focused workspace's name is the task tag"
license = "MIT"
repository = "https://github.com/pauldaywork/niri-tasks"
readme = "README.md"
keywords = ["niri", "taskwarrior", "wayland"]

[lib]
name = "niri_tasks"
path = "src/lib.rs"

[[bin]]
name = "niritasks"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Matches niri 26.04 — the crate tracks niri's release versioning.
niri-ipc = "26.4"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
# The task panel asks niri to blur behind its cards over
# ext-background-effect-v1, which is still in wayland-protocols' staging set.
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[profile.release]
strip = true
lto = true
